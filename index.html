<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADB Tablet Controller</title>
    <link rel="stylesheet" href="theme-light.css" id="themeStylesheet">
    <style>
        .theme-switcher {
            position: fixed;
            top: 20px;
            left: 20px;
            z-index: 1000;
            display: flex;
            gap: 5px;
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            padding: 10px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.2);
        }

        .theme-btn {
            padding: 8px 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 12px;
            transition: all 0.3s;
            font-weight: 500;
        }

        .theme-btn.light {
            background: #667eea;
            color: white;
        }

        .theme-btn.dark-blue {
            background: #1e2139;
            color: #e0e0e0;
            border: 1px solid #3a4068;
        }

        .theme-btn.dark-grey {
            background: #1a1a1a;
            color: #e0e0e0;
            border: 1px solid #3a3a3a;
        }

        .theme-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 2px 8px rgba(0,0,0,0.3);
        }

        .theme-btn.active {
            box-shadow: 0 0 0 2px rgba(255,255,255,0.5);
        }
    </style>
</head>
<body>
    <div class="theme-switcher">
        <button class="theme-btn light active" onclick="switchTheme('light')">☀️ Light</button>
        <button class="theme-btn dark-blue" onclick="switchTheme('dark-blue')">🌙 Dark Blue</button>
        <button class="theme-btn dark-grey" onclick="switchTheme('dark-grey')">🌑 Dark Grey</button>
    </div>

    <div class="container">
        <div class="header">
            <h1>🎮 ADB Tablet Controller</h1>
            <div class="status">
                <div class="status-indicator" id="statusIndicator"></div>
                <span id="statusText">Checking...</span>
                <button class="btn" onclick="connect()">Connect</button>
            </div>
        </div>

        <div class="grid">
            <!-- Playback Controls -->
            <div class="panel">
                <h2>⏯️ Playback</h2>
                <div class="button-grid">
                    <button class="control-btn" onclick="sendCommand('/api/play')">
                        ⏯️<br>Play/Pause
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/rewind')">
                        ⏪<br>Rewind
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/forward')">
                        ⏩<br>Forward
                    </button>
                    <button class="control-btn success" onclick="previousVideo()">
                        ⏮️<br>Previous
                    </button>
                    <button class="control-btn success" onclick="nextVideo()">
                        ⏭️<br>Next
                    </button>
                </div>
            </div>

            <!-- Volume Controls -->
            <div class="panel">
                <h2>🔊 Volume</h2>
                <div class="button-grid">
                    <button class="control-btn" onclick="sendCommand('/api/volume/up')">
                        🔊<br>Volume Up
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/volume/down')">
                        🔉<br>Volume Down
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/volume/mute')">
                        🔇<br>Mute
                    </button>
                </div>
            </div>

            <!-- View Controls -->
            <div class="panel">
                <h2>👁️ View</h2>
                <div class="button-grid">
                    <button class="control-btn" onclick="sendCommand('/api/fullscreen')">
                        ⛶<br>Fullscreen
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/quality/high')">
                        🎬<br>High Quality
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/speed/up')">
                        ⏩<br>Speed Up
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/speed/down')">
                        ⏪<br>Speed Down
                    </button>
                </div>
            </div>

            <!-- Device Controls -->
            <div class="panel">
                <h2>📱 Device</h2>
                <div class="button-grid">
                    <button class="control-btn" onclick="sendCommand('/api/unlock')">
                        🔓<br>Unlock
                    </button>
                    <button class="control-btn" onclick="sendCommand('/api/bluetooth')">
                        📶<br>Bluetooth
                    </button>
                </div>
            </div>

            <!-- Settings -->
            <div class="panel">
                <h2>⚙️ Settings</h2>
                <div style="display: flex; flex-direction: column; gap: 10px;">
                    <div>
                        <label>Device IP</label>
                        <input type="text" id="deviceIP" placeholder="10.0.90.22">
                    </div>
                    <div>
                        <label>Device Port</label>
                        <input type="number" id="devicePort" placeholder="5555">
                    </div>
                    <div>
                        <label>Unlock PIN</label>
                        <input type="password" id="unlockPin" placeholder="Enter PIN">
                    </div>
                    <button class="btn" onclick="saveSettings()" style="width: 100%;">
                        💾 Save Settings
                    </button>
                </div>
            </div>

            <!-- Playlist -->
            <div class="panel playlist-section">
                <h2>📝 Playlist</h2>
                <div class="add-url-form">
                    <input type="text" id="urlInput" placeholder="Enter YouTube URL...">
                    <button class="btn" onclick="addToPlaylist()">Add</button>
                    <button class="btn secondary" onclick="clearPlaylist()">Clear All</button>
                </div>
                <div class="playlist-items" id="playlistItems">
                    <div class="empty-state">No videos in playlist</div>
                </div>
            </div>
        </div>
    </div>

    <div class="notification" id="notification"></div>

    <script>
        // Theme management
        function switchTheme(theme) {
            const stylesheet = document.getElementById('themeStylesheet');
            const themeButtons = document.querySelectorAll('.theme-btn');
            
            // Update stylesheet
            stylesheet.href = `theme-${theme}.css`;
            
            // Update active button
            themeButtons.forEach(btn => btn.classList.remove('active'));
            event.target.classList.add('active');
            
            // Save preference
            localStorage.setItem('preferredTheme', theme);
        }

        // Load saved theme preference
        window.addEventListener('load', () => {
            const savedTheme = localStorage.getItem('preferredTheme') || 'light';
            const stylesheet = document.getElementById('themeStylesheet');
            stylesheet.href = `theme-${savedTheme}.css`;
            
            // Update active button
            const themeButtons = document.querySelectorAll('.theme-btn');
            themeButtons.forEach(btn => {
                if (btn.classList.contains(savedTheme)) {
                    btn.classList.add('active');
                } else {
                    btn.classList.remove('active');
                }
            });
            
            // Initialize other functionality
            checkStatus();
            loadPlaylist();
            loadSettings();
            setInterval(checkStatus, 5000); // Check every 5 seconds
        });

        async function checkStatus() {
            try {
                const response = await fetch('/api/status');
                const data = await response.json();
                
                const indicator = document.getElementById('statusIndicator');
                const text = document.getElementById('statusText');
                
                if (data.connected) {
                    indicator.classList.add('connected');
                    let statusText = `Connected: ${data.device}`;
                    
                    // Add device name if available
                    if (data.device_info) {
                        const info = data.device_info;
                        if (info.manufacturer && info.model) {
                            statusText = `${info.manufacturer} ${info.model} (${data.device})`;
                        } else if (info.model) {
                            statusText = `${info.model} (${data.device})`;
                        }
                    }
                    
                    text.textContent = statusText;
                } else {
                    indicator.classList.remove('connected');
                    text.textContent = 'Not connected';
                }
            } catch (error) {
                console.error('Status check failed:', error);
            }
        }

        async function connect() {
            const response = await sendCommand('/api/connect');
            setTimeout(checkStatus, 1000);
        }

        async function sendCommand(endpoint, method = 'POST') {
            try {
                const response = await fetch(endpoint, { method });
                const data = await response.json();
                
                showNotification(data.message, data.success ? 'success' : 'error');
                return data;
            } catch (error) {
                showNotification('Command failed: ' + error.message, 'error');
                return null;
            }
        }

        function showNotification(message, type = 'success') {
            const notification = document.getElementById('notification');
            notification.textContent = message;
            notification.className = `notification ${type} show`;
            
            setTimeout(() => {
                notification.classList.remove('show');
            }, 3000);
        }

        async function loadPlaylist() {
            try {
                const response = await fetch('/api/playlist');
                const data = await response.json();
                
                const container = document.getElementById('playlistItems');
                
                if (data.playlist.length === 0) {
                    container.innerHTML = '<div class="empty-state">No videos in playlist</div>';
                    return;
                }
                
                container.innerHTML = data.playlist.map(item => `
                    <div class="playlist-item ${item.is_current ? 'current' : ''}">
                        <span class="playlist-item-url" title="${item.url}">
                            ${item.index + 1}. ${item.url}
                        </span>
                        <div class="playlist-item-actions">
                            <button class="icon-btn" onclick="playVideo(${item.index})">Play</button>
                            <button class="icon-btn danger" onclick="removeVideo(${item.index})">Remove</button>
                        </div>
                    </div>
                `).join('');
            } catch (error) {
                console.error('Failed to load playlist:', error);
            }
        }

        async function addToPlaylist() {
            const input = document.getElementById('urlInput');
            const url = input.value.trim();
            
            if (!url) {
                showNotification('Please enter a URL', 'error');
                return;
            }
            
            try {
                const response = await fetch('/api/playlist/add', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ url })
                });
                
                const data = await response.json();
                showNotification(data.message, data.success ? 'success' : 'error');
                
                if (data.success) {
                    input.value = '';
                    loadPlaylist();
                }
            } catch (error) {
                showNotification('Failed to add URL: ' + error.message, 'error');
            }
        }

        async function playVideo(index) {
            const data = await sendCommand(`/api/playlist/play/${index}`);
            if (data && data.success) {
                loadPlaylist();
            }
        }

        async function removeVideo(index) {
            try {
                const response = await fetch(`/api/playlist/remove/${index}`, {
                    method: 'DELETE'
                });
                const data = await response.json();
                showNotification(data.message, data.success ? 'success' : 'error');
                
                if (data.success) {
                    loadPlaylist();
                }
            } catch (error) {
                showNotification('Failed to remove video: ' + error.message, 'error');
            }
        }

        async function nextVideo() {
            const data = await sendCommand('/api/playlist/next');
            if (data && data.success) {
                loadPlaylist();
            }
        }

        async function previousVideo() {
            const data = await sendCommand('/api/playlist/previous');
            if (data && data.success) {
                loadPlaylist();
            }
        }

        async function clearPlaylist() {
            if (!confirm('Clear entire playlist?')) {
                return;
            }
            
            const data = await sendCommand('/api/playlist/clear');
            if (data && data.success) {
                loadPlaylist();
            }
        }

        // Allow Enter key to add URL
        document.getElementById('urlInput').addEventListener('keypress', (e) => {
            if (e.key === 'Enter') {
                addToPlaylist();
            }
        });

        // Settings management
        async function loadSettings() {
            try {
                const response = await fetch('/api/settings');
                const data = await response.json();
                
                if (data.settings) {
                    document.getElementById('deviceIP').value = data.settings.device_ip || '';
                    document.getElementById('devicePort').value = data.settings.device_port || '';
                    // Don't load PIN (it's masked as ***)
                }
            } catch (error) {
                console.error('Failed to load settings:', error);
            }
        }

        async function saveSettings() {
            const settings = {
                device_ip: document.getElementById('deviceIP').value.trim(),
                device_port: parseInt(document.getElementById('devicePort').value) || 5555,
            };
            
            // Only include PIN if user entered something
            const pin = document.getElementById('unlockPin').value;
            if (pin && pin !== '') {
                settings.unlock_pin = pin;
            }
            
            try {
                const response = await fetch('/api/settings', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(settings)
                });
                
                const data = await response.json();
                showNotification(data.message || 'Settings saved', data.success ? 'success' : 'error');
                
                if (data.success) {
                    // Clear PIN field after saving
                    document.getElementById('unlockPin').value = '';
                    // Reconnect with new settings
                    setTimeout(() => {
                        sendCommand('/api/connect');
                    }, 500);
                }
            } catch (error) {
                showNotification('Failed to save settings: ' + error.message, 'error');
            }
        }
    </script>
</body>
</html>
